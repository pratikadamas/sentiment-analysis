<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — SentimentPulse AI</title>
  <meta name="description" content="Sign in to SentimentPulse AI customer feedback intelligence platform.">

  <!-- Prevent Theme Flash -->
  <script src="/static/theme.js"></script>

  <!-- Google Fonts: Inter & Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            display: ['"Plus Jakarta Sans"', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#eef2ff',
              100: '#e0e7ff',
              200: '#c7d2fe',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
            }
          }
        }
      }
    }
  </script>

  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body class="bg-slate-50 dark:bg-[#0b0f19] text-slate-900 dark:text-slate-100 min-h-screen flex flex-col justify-center py-12 px-4 sm:px-6 lg:px-8 font-sans selection:bg-brand-500 selection:text-white relative transition-colors duration-200">

  <!-- Ambient Glow -->
  <div class="fixed inset-0 overflow-hidden pointer-events-none z-0">
    <div class="absolute -top-40 -left-40 w-96 h-96 bg-indigo-500/10 dark:bg-indigo-600/20 rounded-full blur-3xl"></div>
    <div class="absolute top-1/3 -right-40 w-96 h-96 bg-purple-500/10 dark:bg-purple-600/15 rounded-full blur-3xl"></div>
    <div class="absolute -bottom-40 left-1/3 w-96 h-96 bg-emerald-500/10 dark:bg-emerald-600/10 rounded-full blur-3xl"></div>
  </div>

  <!-- Top Controls: Theme Toggle & Home -->
  <div class="fixed top-4 right-4 z-20 flex items-center space-x-2">
    <button 
      id="theme-toggle" 
      type="button"
      aria-label="Toggle visual theme" 
      class="p-2.5 rounded-xl bg-white dark:bg-slate-900/80 border border-slate-200 dark:border-slate-800 text-slate-600 dark:text-slate-300 hover:text-brand-600 dark:hover:text-brand-400 shadow-sm transition-colors focus-ring"
    >
      <svg class="w-5 h-5 hidden dark:block" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/>
      </svg>
      <svg class="w-5 h-5 block dark:hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/>
      </svg>
    </button>
  </div>

  <div class="sm:mx-auto sm:w-full sm:max-w-md relative z-10">
    <!-- Brand Header -->
    <div class="text-center">
      <a href="/" class="inline-flex items-center space-x-3 group mb-4">
        <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-brand-600 via-indigo-500 to-purple-500 flex items-center justify-center shadow-lg shadow-indigo-500/25 group-hover:scale-105 transition-transform duration-200">
          <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
          </svg>
        </div>
        <span class="text-2xl font-bold font-display tracking-tight text-slate-900 dark:text-white">SentimentPulse</span>
      </a>
      <h1 class="text-2xl sm:text-3xl font-extrabold font-display tracking-tight text-slate-900 dark:text-white">Welcome back</h1>
      <p class="mt-2 text-sm text-slate-500 dark:text-slate-400">
        Don't have an account yet?
        <a href="/register" class="font-semibold text-brand-600 dark:text-brand-500 hover:text-brand-700 dark:hover:text-indigo-400 transition-colors ml-1 underline decoration-brand-500/40 underline-offset-4">Create an account</a>
      </p>
    </div>

    <!-- Login Card -->
    <div class="mt-8">
      <div class="bg-white/95 dark:bg-slate-900/80 backdrop-blur-xl py-8 px-6 sm:px-10 rounded-2xl shadow-xl border border-slate-200 dark:border-slate-800 relative">
        
        <!-- Flash Alert Message -->
        <div id="alert-banner" role="alert" aria-live="polite" class="hidden mb-6 p-4 rounded-xl text-sm border flex items-start space-x-3 transition-all duration-300">
          <svg id="alert-icon" class="w-5 h-5 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"></svg>
          <div class="flex-1">
            <span id="alert-text" class="font-medium"></span>
            <div id="alert-action-container" class="mt-2 hidden">
              <button
                type="button"
                id="alert-resend-btn"
                class="text-xs font-semibold text-brand-600 dark:text-brand-400 hover:underline"
              >
                Resend verification email &rarr;
              </button>
            </div>
          </div>
        </div>

        <!-- Resend Verification Card (Expandable) -->
        <div id="resend-box" class="hidden mb-6 p-4 rounded-xl bg-indigo-500/10 border border-brand-500/30 text-slate-800 dark:text-slate-200 text-sm transition-all duration-300">
          <div class="flex items-center justify-between mb-1.5">
            <span class="text-xs font-bold uppercase tracking-wider text-brand-600 dark:text-brand-400">Resend Verification</span>
            <button type="button" id="close-resend-box" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 text-xs font-bold">&times;</button>
          </div>
          <p class="text-xs text-slate-600 dark:text-slate-400 mb-2.5">
            Enter the email address you registered with:
          </p>
          <div class="flex space-x-2">
            <input
              id="resend-email-input"
              type="email"
              placeholder="name@example.com"
              class="flex-1 px-3 py-2 bg-white dark:bg-slate-950 border border-slate-300 dark:border-slate-700 rounded-xl text-xs text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-brand-500"
            >
            <button
              id="btn-send-resend"
              type="button"
              class="px-3.5 py-2 bg-brand-600 hover:bg-brand-500 text-white rounded-xl text-xs font-semibold shadow-sm focus:outline-none transition-colors disabled:opacity-50"
            >
              Send Link
            </button>
          </div>
          <p id="resend-status-msg" class="mt-2 text-xs font-medium hidden"></p>
        </div>

        <form id="login-form" class="space-y-5" novalidate>
          <!-- Username / Email Field -->
          <div>
            <label for="username" class="block text-xs font-semibold uppercase tracking-wider text-slate-700 dark:text-slate-300 mb-1.5">
              Username or Email
            </label>
            <div class="relative rounded-xl shadow-sm">
              <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400 dark:text-slate-500">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                </svg>
              </div>
              <input 
                id="username" 
                name="username" 
                type="text" 
                autocomplete="username" 
                required 
                placeholder="Enter username or email"
                class="block w-full pl-11 pr-4 py-3 bg-slate-50 dark:bg-slate-950/70 border border-slate-300 dark:border-slate-700/80 rounded-xl text-slate-900 dark:text-white placeholder-slate-400 dark:placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-brand-500/40 focus:border-brand-500 text-sm transition-colors"
              >
            </div>
          </div>

          <!-- Password Field -->
          <div>
            <div class="flex items-center justify-between mb-1.5">
              <label for="password" class="block text-xs font-semibold uppercase tracking-wider text-slate-700 dark:text-slate-300">
                Password
              </label>
            </div>
            <div class="relative rounded-xl shadow-sm">
              <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400 dark:text-slate-500">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                </svg>
              </div>
              <input 
                id="password" 
                name="password" 
                type="password" 
                autocomplete="current-password" 
                required 
                placeholder="••••••••"
                class="block w-full pl-11 pr-11 py-3 bg-slate-50 dark:bg-slate-950/70 border border-slate-300 dark:border-slate-700/80 rounded-xl text-slate-900 dark:text-white placeholder-slate-400 dark:placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-brand-500/40 focus:border-brand-500 text-sm transition-colors"
              >
              <button 
                type="button" 
                id="toggle-password" 
                aria-label="Toggle password visibility"
                class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-slate-600 dark:text-slate-500 dark:hover:text-slate-300 transition-colors focus:outline-none"
              >
                <svg id="eye-icon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                </svg>
              </button>
            </div>
          </div>

          <!-- Submit Button -->
          <div class="pt-2">
            <button 
              type="submit" 
              id="submit-btn"
              class="w-full flex items-center justify-center py-3.5 px-4 rounded-xl text-sm font-semibold text-white bg-brand-600 hover:bg-brand-500 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-offset-white dark:focus:ring-offset-[#0b0f19] focus:ring-brand-500 shadow-lg shadow-indigo-600/25 transition-all duration-200 cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed"
            >
              <svg id="spinner" class="hidden animate-spin -ml-1 mr-2.5 h-4 w-4 text-white" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
              </svg>
              <span id="btn-text">Sign In</span>
            </button>
          </div>
        </form>

        <!-- Resend Link Trigger -->
        <div class="mt-4 text-center">
          <button
            type="button"
            id="open-resend-btn"
            class="text-xs text-slate-500 hover:text-brand-600 dark:text-slate-400 dark:hover:text-brand-400 transition-colors focus:outline-none underline decoration-slate-400/50 hover:decoration-brand-500"
          >
            Didn't receive verification email? Resend link
          </button>
        </div>

        <!-- Back to App Link -->
        <div class="mt-6 text-center border-t border-slate-200 dark:border-slate-800/80 pt-4">
          <a href="/" class="text-xs text-slate-500 hover:text-slate-700 dark:text-slate-400 dark:hover:text-slate-300 transition-colors inline-flex items-center space-x-1">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
            </svg>
            <span>Back to SentimentPulse</span>
          </a>
        </div>

      </div>
    </div>
  </div>

  <script>
    // Elements
    const form = document.getElementById('login-form');
    const usernameInput = document.getElementById('username');
    const passwordInput = document.getElementById('password');
    const submitBtn = document.getElementById('submit-btn');
    const spinner = document.getElementById('spinner');
    const btnText = document.getElementById('btn-text');
    const alertBanner = document.getElementById('alert-banner');
    const alertText = document.getElementById('alert-text');
    const alertIcon = document.getElementById('alert-icon');
    const togglePasswordBtn = document.getElementById('toggle-password');
    const themeToggleBtn = document.getElementById('theme-toggle');

    // Theme toggle handling
    if (themeToggleBtn && window.themeManager) {
      themeToggleBtn.addEventListener('click', () => {
        window.themeManager.toggle();
      });
    }

    // Check for URL query params (verified, reason, registered)
    const urlParams = new URLSearchParams(window.location.search);
    const verifiedParam = urlParams.get('verified');
    const reasonParam = urlParams.get('reason');

    if (verifiedParam === 'true') {
      showAlert('Email verified successfully. You can now sign in.', 'success');
    } else if (verifiedParam === 'false') {
      let failMsg = 'Verification link is invalid or expired. Request a new verification email below.';
      if (reasonParam === 'expired') {
        failMsg = 'Your email verification link has expired. Please request a new link below.';
      } else if (reasonParam === 'used') {
        failMsg = 'This verification link has already been used. Please sign in with your credentials.';
      } else if (reasonParam === 'invalid') {
        failMsg = 'Invalid verification link. Please request a new verification email below.';
      }
      showAlert(failMsg, 'error');
      openResendBox();
    } else if (urlParams.get('registered') === 'true') {
      showAlert('Account created! Please check your email and click the verification link before signing in.', 'success');
      const registeredUsername = urlParams.get('username');
      if (registeredUsername) {
        usernameInput.value = registeredUsername;
      }
    }

    // Toggle password visibility
    togglePasswordBtn.addEventListener('click', () => {
      const isPassword = passwordInput.type === 'password';
      passwordInput.type = isPassword ? 'text' : 'password';
      togglePasswordBtn.classList.toggle('text-brand-600', isPassword);
    });

    // Alert helper
    const alertActionContainer = document.getElementById('alert-action-container');
    const alertResendBtn = document.getElementById('alert-resend-btn');

    function showAlert(message, type = 'error', showResendAction = false) {
      alertBanner.classList.remove('hidden', 'bg-rose-500/10', 'border-rose-500/30', 'text-rose-600', 'dark:text-rose-400', 'bg-emerald-500/10', 'border-emerald-500/30', 'text-emerald-700', 'dark:text-emerald-400');
      
      if (type === 'error') {
        alertBanner.classList.add('bg-rose-500/10', 'border-rose-500/30', 'text-rose-600', 'dark:text-rose-400');
        alertIcon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>';
      } else {
        alertBanner.classList.add('bg-emerald-500/10', 'border-emerald-500/30', 'text-emerald-700', 'dark:text-emerald-400');
        alertIcon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>';
      }

      alertText.textContent = message;
      if (showResendAction && alertActionContainer) {
        alertActionContainer.classList.remove('hidden');
      } else if (alertActionContainer) {
        alertActionContainer.classList.add('hidden');
      }
    }

    function hideAlert() {
      alertBanner.classList.add('hidden');
      if (alertActionContainer) alertActionContainer.classList.add('hidden');
    }

    // Resend Box elements & handlers
    const resendBox = document.getElementById('resend-box');
    const openResendBtn = document.getElementById('open-resend-btn');
    const closeResendBox = document.getElementById('close-resend-box');
    const resendEmailInput = document.getElementById('resend-email-input');
    const btnSendResend = document.getElementById('btn-send-resend');
    const resendStatusMsg = document.getElementById('resend-status-msg');

    function openResendBox() {
      if (resendBox) {
        resendBox.classList.remove('hidden');
        const typed = usernameInput.value.trim();
        if (typed.includes('@') && !resendEmailInput.value) {
          resendEmailInput.value = typed;
        }
        resendEmailInput.focus();
      }
    }

    if (openResendBtn) {
      openResendBtn.addEventListener('click', openResendBox);
    }
    if (closeResendBox) {
      closeResendBox.addEventListener('click', () => {
        resendBox.classList.add('hidden');
      });
    }
    if (alertResendBtn) {
      alertResendBtn.addEventListener('click', openResendBox);
    }

    if (btnSendResend) {
      btnSendResend.addEventListener('click', async () => {
        const email = resendEmailInput.value.trim();
        if (!email) {
          resendStatusMsg.textContent = 'Please enter your email address.';
          resendStatusMsg.className = 'mt-2 text-xs font-medium text-rose-500 block';
          return;
        }

        btnSendResend.disabled = true;
        btnSendResend.textContent = 'Sending...';

        try {
          const res = await fetch('/auth/resend-verification', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email })
          });
          const data = await res.json().catch(() => ({}));
          resendStatusMsg.textContent = data.message || 'If an account exists with that email, a verification link has been sent.';
          resendStatusMsg.className = 'mt-2 text-xs font-medium text-emerald-500 block';
        } catch (e) {
          resendStatusMsg.textContent = 'Network error: could not send verification email.';
          resendStatusMsg.className = 'mt-2 text-xs font-medium text-rose-500 block';
        } finally {
          btnSendResend.disabled = false;
          btnSendResend.textContent = 'Send Link';
        }
      });
    }

    function parseLoginErrorMessage(response, data) {
      if (data && typeof data.detail === 'string' && data.detail.trim()) {
        return data.detail;
      }
      if (data && Array.isArray(data.detail)) {
        return data.detail.map(e => e.msg).join('. ');
      }
      if (data && typeof data.message === 'string' && data.message.trim()) {
        return data.message;
      }
      switch (response.status) {
        case 401:
          return 'Incorrect username or password. Please verify your credentials.';
        case 403:
          return 'Please verify your email address before signing in.';
        case 422:
          return 'Please provide both your username and password.';
        case 429:
          return 'Too many login attempts. Please wait a moment before trying again.';
        case 500:
        case 502:
        case 503:
        case 504:
          return 'Authentication service is temporarily unavailable. Please try again shortly.';
        default:
          return `Sign in failed (HTTP ${response.status}). Please check your credentials.`;
      }
    }

    function setLoading(isLoading) {
      submitBtn.disabled = isLoading;
      if (isLoading) {
        submitBtn.setAttribute('aria-busy', 'true');
        spinner.classList.remove('hidden');
        btnText.textContent = 'Authenticating...';
      } else {
        submitBtn.removeAttribute('aria-busy');
        spinner.classList.add('hidden');
        btnText.textContent = 'Sign In';
      }
    }

    // Form Submission Handler
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideAlert();

      if (submitBtn.disabled) return;

      const username = usernameInput.value.trim();
      const password = passwordInput.value;

      if (!username || !password) {
        showAlert('Please enter both your username and password.');
        return;
      }

      setLoading(true);

      try {
        const response = await fetch('/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ username, password })
        });

        let data = {};
        try {
          data = await response.json();
        } catch (_) {
          data = {};
        }

        if (!response.ok) {
          const errorMsg = parseLoginErrorMessage(response, data);
          const isUnverified = response.status === 403 && (errorMsg.includes('verify your email') || errorMsg.includes('verification'));
          showAlert(errorMsg, 'error', isUnverified);
          if (isUnverified) {
            openResendBox();
          }
          setLoading(false);
          return;
        }

        showAlert('Login successful! Redirecting to dashboard...', 'success');
        
        // Redirect to requested next URL or home
        const nextUrl = urlParams.get('next') || '/';
        setTimeout(() => {
          window.location.href = nextUrl;
        }, 400);

      } catch (err) {
        showAlert('Network error: Unable to reach the server. Please check your internet connection.');
        setLoading(false);
      }
    });
  </script>
</body>
</html>
