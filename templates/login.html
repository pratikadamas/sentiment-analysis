<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — SentimentPulse AI</title>
  <meta name="description" content="Sign in to SentimentPulse AI to access real-time NLP sentiment analysis and predictions.">

  <!-- Theme Initialization (Prevents FOUC) -->
  <script>
    if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
    } else {
      document.documentElement.classList.remove('dark');
    }
  </script>

  <!-- Google Fonts: Inter & Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/static/theme.js"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            display: ['"Plus Jakarta Sans"', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#eef2ff',
              100: '#e0e7ff',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
            }
          }
        }
      }
    }
  </script>

  <style>
    .glass-card {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(226, 232, 240, 0.9);
    }
    .dark .glass-card {
      background: rgba(17, 24, 39, 0.78);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .glow-brand {
      box-shadow: 0 0 35px -5px rgba(99, 102, 241, 0.25);
    }
    .dark .glow-brand {
      box-shadow: 0 0 35px -5px rgba(99, 102, 241, 0.35);
    }
  </style>
</head>
<body class="bg-slate-50 dark:bg-[#0b0f19] text-slate-800 dark:text-slate-100 min-h-screen flex flex-col justify-center py-12 px-4 sm:px-6 lg:px-8 font-sans selection:bg-brand-500 selection:text-white relative transition-colors duration-200">

  <!-- Background Ambient Glow -->
  <div class="fixed inset-0 overflow-hidden pointer-events-none z-0">
    <div class="absolute -top-40 -left-40 w-96 h-96 bg-indigo-500/10 dark:bg-indigo-600/20 rounded-full blur-3xl"></div>
    <div class="absolute top-1/3 -right-40 w-96 h-96 bg-purple-500/10 dark:bg-purple-600/15 rounded-full blur-3xl"></div>
    <div class="absolute -bottom-40 left-1/3 w-96 h-96 bg-emerald-500/10 dark:bg-emerald-600/10 rounded-full blur-3xl"></div>
  </div>

  <!-- Top Navigation Bar -->
  <nav class="absolute top-0 left-0 right-0 z-20 px-4 sm:px-6 py-4 flex items-center justify-between">
    <a href="/" class="inline-flex items-center space-x-1.5 text-xs font-medium text-slate-600 hover:text-slate-900 dark:text-slate-400 dark:hover:text-white transition-colors">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
      </svg>
      <span>Back to Home</span>
    </a>

    <!-- Theme Toggle Button -->
    <button 
      type="button" 
      id="theme-toggle"
      class="theme-toggle-btn p-2 rounded-lg text-slate-600 hover:text-slate-900 dark:text-slate-400 dark:hover:text-white bg-white/80 hover:bg-slate-100 dark:bg-slate-800/80 dark:hover:bg-slate-700/80 border border-slate-200 dark:border-slate-700/80 shadow-sm backdrop-blur-sm transition-colors focus:outline-none focus:ring-2 focus:ring-brand-500/50"
      aria-label="Toggle light/dark mode"
      title="Toggle light/dark mode"
    >
      <!-- Sun Icon (shown in dark mode to switch to light) -->
      <svg class="w-4 h-4 theme-icon-sun hidden text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
      </svg>
      <!-- Moon Icon (shown in light mode to switch to dark) -->
      <svg class="w-4 h-4 theme-icon-moon text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
      </svg>
    </button>
  </nav>

  <div class="sm:mx-auto sm:w-full sm:max-w-md relative z-10">
    <!-- Brand Header -->
    <div class="text-center">
      <a href="/" class="inline-flex items-center space-x-3 group mb-4">
        <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-brand-600 via-indigo-500 to-purple-400 flex items-center justify-center shadow-lg shadow-indigo-500/30 group-hover:scale-105 transition-transform duration-200">
          <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
          </svg>
        </div>
        <span class="text-2xl font-bold font-display tracking-tight bg-gradient-to-r from-slate-900 via-slate-800 to-slate-600 dark:from-white dark:via-slate-200 dark:to-slate-400 bg-clip-text text-transparent">SentimentPulse</span>
      </a>
      <h2 class="text-2xl sm:text-3xl font-extrabold font-display tracking-tight text-slate-900 dark:text-white">Welcome back</h2>
      <p class="mt-2 text-sm text-slate-600 dark:text-slate-400">
        Don't have an account yet?
        <a href="/register" class="font-medium text-brand-600 dark:text-brand-500 hover:text-brand-700 dark:hover:text-indigo-400 transition-colors ml-1 underline decoration-brand-500/40 underline-offset-4">Create an account</a>
      </p>
    </div>

    <!-- Login Card -->
    <div class="mt-8">
      <div class="glass-card py-8 px-6 sm:px-10 rounded-2xl shadow-xl dark:shadow-2xl relative glow-brand border border-slate-200/80 dark:border-slate-800">
        
        <!-- Flash Alert Message (Success / Error) -->
        <div id="alert-banner" class="hidden mb-6 p-4 rounded-xl text-sm border flex items-start space-x-3 transition-all duration-300">
          <svg id="alert-icon" class="w-5 h-5 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"></svg>
          <span id="alert-text" class="flex-1 font-medium"></span>
        </div>

        <form id="login-form" class="space-y-5" novalidate>
          <!-- Username / Email Field -->
          <div>
            <label for="username" class="block text-xs font-semibold uppercase tracking-wider text-slate-700 dark:text-slate-300 mb-1.5">
              Username or Email
            </label>
            <div class="relative rounded-xl shadow-sm">
              <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400 dark:text-slate-500">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                </svg>
              </div>
              <input 
                id="username" 
                name="username" 
                type="text" 
                autocomplete="username" 
                required 
                placeholder="Enter your username or email"
                class="block w-full pl-11 pr-4 py-3 bg-white dark:bg-slate-900/80 border border-slate-300 dark:border-slate-700/80 rounded-xl text-slate-900 dark:text-white placeholder-slate-400 dark:placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-brand-500/30 focus:border-brand-500 text-sm shadow-sm transition-colors"
              >
            </div>
          </div>

          <!-- Password Field -->
          <div>
            <div class="flex items-center justify-between mb-1.5">
              <label for="password" class="block text-xs font-semibold uppercase tracking-wider text-slate-700 dark:text-slate-300">
                Password
              </label>
            </div>
            <div class="relative rounded-xl shadow-sm">
              <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400 dark:text-slate-500">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                </svg>
              </div>
              <input 
                id="password" 
                name="password" 
                type="password" 
                autocomplete="current-password" 
                required 
                placeholder="••••••••"
                class="block w-full pl-11 pr-11 py-3 bg-white dark:bg-slate-900/80 border border-slate-300 dark:border-slate-700/80 rounded-xl text-slate-900 dark:text-white placeholder-slate-400 dark:placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-brand-500/30 focus:border-brand-500 text-sm shadow-sm transition-colors"
              >
              <button 
                type="button" 
                id="toggle-password" 
                tabindex="-1"
                class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-slate-600 dark:text-slate-500 dark:hover:text-slate-300 transition-colors"
                title="Toggle password visibility"
              >
                <svg id="eye-icon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                </svg>
              </button>
            </div>
          </div>

          <!-- Submit Button -->
          <div class="pt-2">
            <button 
              type="submit" 
              id="submit-btn"
              class="w-full flex items-center justify-center py-3.5 px-4 rounded-xl text-sm font-semibold text-white bg-gradient-to-r from-brand-600 to-indigo-600 hover:from-brand-500 hover:to-indigo-500 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-offset-white dark:focus:ring-offset-[#0b0f19] focus:ring-brand-500 shadow-lg shadow-indigo-600/30 transition-all duration-200 cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed"
            >
              <svg id="spinner" class="hidden animate-spin -ml-1 mr-2.5 h-4 w-4 text-white" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
              </svg>
              <span id="btn-text">Sign In</span>
            </button>
          </div>
        </form>

        <!-- Back to App Link -->
        <div class="mt-6 text-center border-t border-slate-200 dark:border-slate-800/80 pt-4">
          <a href="/" class="text-xs text-slate-500 hover:text-slate-800 dark:text-slate-400 dark:hover:text-slate-200 transition-colors inline-flex items-center space-x-1">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
            </svg>
            <span>Back to SentimentPulse</span>
          </a>
        </div>

      </div>
    </div>
  </div>

  <script>
    // Elements
    const form = document.getElementById('login-form');
    const usernameInput = document.getElementById('username');
    const passwordInput = document.getElementById('password');
    const submitBtn = document.getElementById('submit-btn');
    const spinner = document.getElementById('spinner');
    const btnText = document.getElementById('btn-text');
    const alertBanner = document.getElementById('alert-banner');
    const alertText = document.getElementById('alert-text');
    const alertIcon = document.getElementById('alert-icon');
    const togglePasswordBtn = document.getElementById('toggle-password');

    // Check for registration success param in URL
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('registered') === 'true') {
      showAlert('Account created successfully! Please sign in with your credentials.', 'success');
      const registeredUsername = urlParams.get('username');
      if (registeredUsername) {
        usernameInput.value = registeredUsername;
        passwordInput.focus();
      }
    }

    // Toggle password visibility
    togglePasswordBtn.addEventListener('click', () => {
      const isPassword = passwordInput.type === 'password';
      passwordInput.type = isPassword ? 'text' : 'password';
      togglePasswordBtn.classList.toggle('text-brand-400', isPassword);
    });

    // Helper: Show Alert
    function showAlert(message, type = 'error') {
      alertBanner.classList.remove('hidden', 'bg-rose-50', 'dark:bg-rose-500/10', 'border-rose-200', 'dark:border-rose-500/30', 'text-rose-700', 'dark:text-rose-400', 'bg-emerald-50', 'dark:bg-emerald-500/10', 'border-emerald-200', 'dark:border-emerald-500/30', 'text-emerald-700', 'dark:text-emerald-400');
      
      if (type === 'error') {
        alertBanner.classList.add('bg-rose-50', 'dark:bg-rose-500/10', 'border-rose-200', 'dark:border-rose-500/30', 'text-rose-700', 'dark:text-rose-400');
        alertIcon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>';
      } else {
        alertBanner.classList.add('bg-emerald-50', 'dark:bg-emerald-500/10', 'border-emerald-200', 'dark:border-emerald-500/30', 'text-emerald-700', 'dark:text-emerald-400');
        alertIcon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>';
      }

      alertText.textContent = message;
    }

    function hideAlert() {
      alertBanner.classList.add('hidden');
    }

    function setLoading(isLoading) {
      submitBtn.disabled = isLoading;
      if (isLoading) {
        spinner.classList.remove('hidden');
        btnText.textContent = 'Authenticating...';
      } else {
        spinner.classList.add('hidden');
        btnText.textContent = 'Sign In';
      }
    }

    // Form Submission Handler
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideAlert();

      const username = usernameInput.value.trim();
      const password = passwordInput.value;

      if (!username || !password) {
        showAlert('Please enter both your username and password.');
        return;
      }

      setLoading(true);

      try {
        const response = await fetch('/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ username, password })
        });

        const data = await response.json();

        if (!response.ok) {
          const errorMsg = data.detail || 'Login failed. Please verify your credentials.';
          showAlert(errorMsg, 'error');
          setLoading(false);
          return;
        }

        // Save token & user info in localStorage
        localStorage.setItem('token', data.access_token);
        localStorage.setItem('username', data.username);
        if (data.email) {
          localStorage.setItem('email', data.email);
        }

        showAlert('Login successful! Redirecting to dashboard...', 'success');
        
        // Smooth redirect to main app
        setTimeout(() => {
          window.location.href = '/';
        }, 500);

      } catch (err) {
        showAlert('Network error: unable to reach the server. Please check your connection.');
        setLoading(false);
      }
    });
  </script>
</body>
</html>
